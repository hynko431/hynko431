<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 310" width="1200" height="310" role="img" aria-labelledby="b3d-title b3d-desc">
  <title id="b3d-title">Siva Venkata Bhanu Prakash Irakam — 3D Isometric Profile Banner</title>
  <desc id="b3d-desc">3D isometric architectural hero banner for Siva Venkata Bhanu Prakash Irakam, AI/ML, Backend, and Systems Engineer at Saral Vidhya in Hyderabad, India.</desc>
  <defs>
    <linearGradient id="bg-g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0D1117"/>
      <stop offset="55%" stop-color="#101827"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </linearGradient>
    <radialGradient id="stage-glow" cx="79%" cy="46%" r="36%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#818CF8" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bar-g" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
    <pattern id="b-dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.95" fill="#30363D" fill-opacity="0.5"/>
    </pattern>
    <filter id="b-blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <style>
      .eyebrow {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 1.5px;
        fill: #58A6FF;
      }
      .name {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 36px;
        font-weight: 700;
        letter-spacing: -0.75px;
        fill: #F0F6FC;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        font-size: 16px;
        font-weight: 400;
        fill: #B1BAC4;
      }
      .meta {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 12px;
        fill: #8B949E;
      }
      .pill-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
        font-size: 11.5px;
        font-weight: 500;
        fill: #E6EDF3;
      }
      .float-1 { animation: levitate 5.8s cubic-bezier(0.37, 0, 0.63, 1) infinite; }
      .float-2 { animation: levitate 5.8s cubic-bezier(0.37, 0, 0.63, 1) -1.2s infinite; }
      .float-3 { animation: levitate 5.8s cubic-bezier(0.37, 0, 0.63, 1) -2.4s infinite; }
      .float-sat { animation: levitate-sat 4.6s cubic-bezier(0.37, 0, 0.63, 1) -0.8s infinite; }
      .pulse { animation: pulse-op 3.2s ease-in-out infinite; }
      @keyframes levitate {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes levitate-sat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-9px); }
      }
      @keyframes pulse-op {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.4; }
      }
      @media (prefers-reduced-motion: reduce) {
        .float-1, .float-2, .float-3, .float-sat, .pulse { animation: none; }
      }
    </style>
  </defs>

