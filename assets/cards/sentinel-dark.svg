  <title id="c-sentinel-dark-t">OmniConnect Sentinel — Rust Endpoint &amp; USB Security</title>
  <desc id="c-sentinel-dark-d">OmniConnect Sentinel (Rust Endpoint &amp; USB Security): Userspace Rust endpoint and USB device security platform using AES-256-GCM encrypted caching, Content Disarm and Reconstruction (CDR) workers, TPM 2.0, and ML-KEM-768 post-quantum key exchange. Stack: Rust, AES-256-GCM, TPM 2.0, ML-KEM-768.</desc>
